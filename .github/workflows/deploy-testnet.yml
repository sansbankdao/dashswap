# .github/workflows/deploy-testnet.yml
#
# Deploy dashswap.xyz to Cloudflare Pages — a SINGLE project serves
# dashswap.xyz (mainnet) AND testnet.dashswap.xyz (testnet); hostname
# detection in stores/system.ts picks the network. The per-network Worker
# routes + dev keys are baked into the build (both instances are live).
#
# Runs on the SELF-HOSTED runner (evorunner VPS) — GitHub-hosted runners
# are unavailable (billing block); self-hosted minutes are free. This
# follows the org's existing per-repo runner pattern
# (actions.runner.<org>-<repo>.<runner>.service on evorunner).
#
# Prerequisites (see docs/DEPLOYMENT.md):
#   1. A runner registered for THIS repo on evorunner with the `evorunner`
#      label, running as a systemd service.
#   2. >=3 GB free disk on evorunner (the build needs node_modules + output).
#   3. Repo SECRETS: CLOUDFLARE_API_TOKEN (Pages:Edit), CLOUDFLARE_ACCOUNT_ID,
#      PAGES_PROJECT (the single Pages project bound to both hostnames),
#      MAINNET_SWAP_API_KEY (dsw_dev_2a05…, production instance),
#      TESTNET_SWAP_API_KEY (dsw_dev_e25c…, testnet instance).
# The workflow SKIPS (no failure) until the secrets exist.

name: deploy-testnet

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-testnet
  cancel-in-progress: true

jobs:
  deploy:
    name: build + deploy (testnet)
    runs-on: [self-hosted, evorunner]

    steps:
      - name: Guard — deploy secrets present?
        id: guard
        env:
          PAGES_PROJECT: ${{ secrets.PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$PAGES_PROJECT" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Deploy secrets missing (PAGES_PROJECT / CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID) — skipping. See docs/DEPLOYMENT.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - name: Build (pnpm frozen install + nuxt build)
        if: steps.guard.outputs.skip != 'true'
        env:
          # Both Worker routes are BAKED in nuxt.config (testnet instance
          # live per HANDOFF-3-ACK); NUXT_PUBLIC_ env vars are read at
          # BUILD time. One build serves both hostnames.
          NUXT_PUBLIC_SWAP_API_KEY_MAINNET: ${{ secrets.MAINNET_SWAP_API_KEY }}
          NUXT_PUBLIC_SWAP_API_KEY_TESTNET: ${{ secrets.TESTNET_SWAP_API_KEY }}
          # Nitro preset: cloudflare-pages for the Pages target (flip only
          # if the hosting model changes — see docs/DEPLOYMENT.md).
          NITRO_PRESET: ${{ vars.NITRO_PRESET || 'cloudflare-pages' }}
        run: |
          # Node 24 lives on the runner-data volume (system node 20 is kept
          # for the other repos' runners — findPackageJSON needs >=22.14).
          export PATH=/mnt/runner-data/node24/bin:$PATH
          pnpm install --frozen-lockfile
          pnpm build

      - name: Deploy (wrangler pages)
        if: steps.guard.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ secrets.PAGES_PROJECT }}
        run: |
          # The cloudflare-pages preset outputs to ./dist (_worker.js +
          # _nuxt + _routes.json) — verified by the dry-run build.
          export PATH=/mnt/runner-data/node24/bin:$PATH
          npx wrangler@3 pages deploy dist --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
